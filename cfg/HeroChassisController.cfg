#!/usr/bin/env python3
PACKAGE = "hero_chassis_controller"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# 定义四个轮子的 P, I, D 参数
# add(名字, 类型, 级别, 描述, 默认值, 最小值, 最大值)
gen.add("front_left_p",   double_t, 0, "Front Left P", 10.0, 0.0, 100.0)
gen.add("front_left_i",   double_t, 0, "Front Left I", 0.1,  0.0, 100.0)
gen.add("front_left_d",   double_t, 0, "Front Left D", 0.05, 0.0, 100.0)

gen.add("front_right_p",  double_t, 0, "Front Right P", 10.0, 0.0, 100.0)
gen.add("front_right_i",  double_t, 0, "Front Right I", 0.1,  0.0, 100.0)
gen.add("front_right_d",  double_t, 0, "Front Right D", 0.05, 0.0, 100.0)

gen.add("back_left_p",    double_t, 0, "Back Left P", 10.0, 0.0, 100.0)
gen.add("back_left_i",    double_t, 0, "Back Left I", 0.1,  0.0, 100.0)
gen.add("back_left_d",    double_t, 0, "Back Left D", 0.05, 0.0, 100.0)

gen.add("back_right_p",   double_t, 0, "Back Right P", 10.0, 0.0, 100.0)
gen.add("back_right_i",   double_t, 0, "Back Right I", 0.1,  0.0, 100.0)
gen.add("back_right_d",   double_t, 0, "Back Right D", 0.05, 0.0, 100.0)

exit(gen.generate(PACKAGE, "hero_chassis_controller", "HeroChassisController"))